apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/instance: prometheus-stack
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: grafana
    app.kubernetes.io/version: 13.3.1
    helm.sh/chart: grafana-14.5.0
  name: prometheus-stack-grafana
  namespace: monitoring
spec:
  ports:
  - name: port-1
    port: 3000
    protocol: TCP
    targetPort: 3000
  - name: port-2-tcp
    port: 9094
    protocol: TCP
    targetPort: 9094
  - name: port-2-udp
    port: 9094
    protocol: UDP
    targetPort: 9094
  - name: port-3
    port: 6060
    protocol: TCP
    targetPort: 6060
  selector:
    app.kubernetes.io/instance: prometheus-stack
    app.kubernetes.io/name: grafana
  type: LoadBalancer
status:
  loadBalancer: {}
